.otto-taskItemdragged{
    border-radius: 10px;
    z-index: 999999999999999;

    display: flex;
    flex-direction: row;
    justify-content: space-between;

    color: black; /* Corresponds to text-black */

    gap:4px;

    display: flex;
    flex-direction: row;
    align-items: center;
    gap:10px;
}

    border-radius: 100%;
    /* background-color: #68AEFF; */
    margin-right: 10px;

    border: 1px solid rgba(0, 0, 0, 0.1); /* Black with 10% opacity */

    display: grid;
    place-items: center;

    color: #646778;

    font-size: 14px;
    font-weight: 500;
}

    color: #646778;
    padding: 6px 12px;
    background-color: rgba(0, 0, 0, 0.05);
    font-size: 12px;
    border-radius: 32px;
}

    opacity: 1;
